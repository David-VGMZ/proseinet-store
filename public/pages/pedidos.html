    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, collection, query, where, getDocs, orderBy, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { getMessaging, onMessage, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBg9o3wVZoA26Aob2RnbVPV8vGv4GE44gs",
            authDomain: "primer-proyecto-7b2f4.firebaseapp.com",
            projectId: "primer-proyecto-7b2f4",
            storageBucket: "primer-proyecto-7b2f4.firebasestorage.app",
            messagingSenderId: "627220736817",
            appId: "1:627220736817:web:a2eb4f187322c609f11e10"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // SISTEMA DE CACHÉ PARA PEDIDOS
        const CACHE_KEY_PEDIDOS = 'pedidos_cache';
        const CACHE_TIMESTAMP_KEY = 'pedidos_cache_timestamp';
        const CACHE_DURATION = 5 * 60 * 1000;
        
        // Inicializar Messaging: esperar a que el SW esté activo antes de llamar getMessaging
        let messaging = null;
        try {
            const supported = await isSupported();
            if (supported && 'serviceWorker' in navigator) {
                // Registrar SW y esperar a que el SW tome control (activo + claim)
                const reg = await navigator.serviceWorker.register('/sworker.js');
                // Si ya hay un SW activo usarlo, si no esperar a que lo esté
                const activeReg = await new Promise((resolve) => {
                    if (reg.active) {
                        resolve(reg);
                    } else {
                        const sw = reg.installing || reg.waiting;
                        sw.addEventListener('statechange', function handler(e) {
                            if (e.target.state === 'activated') {
                                sw.removeEventListener('statechange', handler);
                                resolve(reg);
                            }
                        });
                    }
                });
                messaging = getMessaging(app);
                console.log('Firebase Messaging listo.');
            } else {
                console.warn('Firebase Messaging no soportado en este entorno.');
            }
        } catch (e) {
            console.warn('Firebase Messaging no disponible:', e.message);
        }

        async function activarNotificaciones() { 
            if (!messaging) {
                console.warn('Messaging no está inicializado. Se requiere HTTPS y Service Worker.');
                return;
            }

            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const swRegistration = await navigator.serviceWorker.ready;
                    const token = await getToken(messaging, {
                        vapidKey: 'BOBNEhfpPbnz0ew_HRCewocD6KyQYLy9ZmW0fjE6I4FThbc1vEcqW5hZD6SzugWi3GLpS9m7c__LiVyCvj3BLeM',
                        serviceWorkerRegistration: swRegistration
                    });
                    if (token) {
                        console.log("Token del usuario:", token);
                    }
                }
            } catch (error) {
                console.error("Error al obtener permiso:", error);
            }
        }

        async function notificarCliente(tokenCliente, estado) {
            const URL_PUENTE = "https://script.google.com/macros/s/AKfycbw6uAV-RoUhDieHPbWrQDHlwYf5NLMQja6vi0uD2vXaBuii4ADUW5hC5DgYDQoDWfEqPg/exec";

            await fetch(URL_PUENTE, {
                method: "POST",
                body: JSON.stringify({
                    token: tokenCliente,
                    title: "Actualización de Pedido",
                    body: "Tu pedido ahora está: " + estado
                })
            });
        }

         // Escuchar mensajes cuando la app ESTÁ ABIERTA
        if (messaging) {
            onMessage(messaging, (payload) => {
                console.log('Mensaje en primer plano:', payload);
                Swal.fire({
                    title: `${payload.notification.title}`,
                    text: `${payload.notification.body}`,
                    icon: "info"
                });
            });
        }

        // Exportar para usarlo en un botón
        window.activarNotificaciones = activarNotificaciones; 
        
        function guardarPedidosEnCache(pedidos) {
            try {
                // Serializar los pedidos con fechas convertidas
                const pedidosSerializados = pedidos.map(p => ({
                    ...p,
                    fecha: p.fecha?.seconds ? p.fecha : { seconds: Date.now() / 1000 }
                }));
                localStorage.setItem(CACHE_KEY_PEDIDOS, JSON.stringify(pedidosSerializados));
                localStorage.setItem(CACHE_TIMESTAMP_KEY, Date.now().toString());
                console.log('Pedidos guardados en caché');
            } catch (error) {
                console.error('Error guardando caché:', error);
            }
        }

        function obtenerPedidosDeCache() {
            try {
                const timestamp = localStorage.getItem(CACHE_TIMESTAMP_KEY);
                const now = Date.now();
                
                // Verificar si el caché es válido
                if (timestamp && (now - parseInt(timestamp)) < CACHE_DURATION) {
                    const cachedData = localStorage.getItem(CACHE_KEY_PEDIDOS);
                    if (cachedData) {
                        console.log('Caché válido encontrado');
                        return JSON.parse(cachedData);
                    }
                } else if (timestamp) {
                    console.log('Caché expirado');
                }
                return null;
            } catch (error) {
                console.error('Error leyendo caché:', error);
                return null;
            }
        }

        function mostrarPedidos(pedidosArray, fromCache = false) {
            const listaPedidos = document.getElementById('listaPedidos');
            const userEmail = localStorage.getItem('userEmail');
            const emailElement = document.getElementById('emailPerfil');

            if (emailElement) {
                emailElement.textContent = userEmail;
            }

            let totalPedidos = 0;
            let totalGastado = 0;
            let pedidosHTML = '';

            pedidosArray.forEach((pedido) => {
                totalPedidos++;
                totalGastado += pedido.total || 0;

                // Manejar la fecha
                let fecha = 'Fecha no disponible';
                if (pedido.fecha) {
                    try {
                        if (pedido.fecha.toDate) {
                            // Timestamp de Firestore
                            fecha = pedido.fecha.toDate().toLocaleDateString('es-MX', {
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric'
                            });
                        } else if (pedido.fecha.seconds) {
                            // Timestamp serializado desde caché
                            fecha = new Date(pedido.fecha.seconds * 1000).toLocaleDateString('es-MX', {
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric'
                            });
                        } else if (typeof pedido.fecha === 'string') {
                            // String ISO
                            fecha = new Date(pedido.fecha).toLocaleDateString('es-MX', {
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric'
                            });
                        }
                    } catch (e) {
                        console.error('Error procesando fecha:', e);
                    }
                }

                const estadoClass = {
                    'Pendiente': 'bg-warning',
                    'Enviado': 'bg-primary',
                    'Entregado': 'bg-success',
                    'Completado': 'bg-black',
                    'Cancelado': 'bg-danger',
                    'Pagado' : 'bg-info'
                }[pedido.estado] || 'bg-secondary';

                const productosHTML = pedido.productos.map(p => `
                    <div class="producto-pedido d-flex align-items-center" onclick="window.location.href='producto.html#${p.id}'">
                        <img class="img-pedidos" src="${p.imagenes}" width="50" height="50" class="rounded me-3" style="object-fit: cover; cursor: pointer;">
                        <div class="flex-grow-1">
                            <strong>${p.nombre}</strong><br>
                            <small class="text-muted">$${Number(p.precio).toLocaleString('es-MX', {minimumFractionDigits: 2})} x ${p.cantidad}</small>
                        </div>
                        <strong class="text-success">$${(p.precio * p.cantidad).toLocaleString('es-MX', {minimumFractionDigits: 2})}</strong>
                    </div>
                `).join('');
                
                if(pedido.datosEnvio.direccion == "Solo Entrega"){
                    pedidosHTML += `
                    <div class="pedido-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h5 class="mb-1">${pedido.id}</h5>
                                <small class="text-muted"><i class="far fa-calendar me-1"></i>${fecha}</small>
                            </div>
                            <span class="badge badge-estado ${estadoClass}">${pedido.estado}</span>
                        </div>
                        <div class="mb-3">
                            ${productosHTML}
                        </div>
                        <div class="border-top pt-3">
                            <div class="row">
                                <div class="col-md-6">
                                    <small class="text-muted d-block mb-1"><strong>Cotizacion de:</strong></small>
                                    <small>${pedido.datosEnvio?.nombre || 'N/A'}</small><br>
                                    <small>${pedido.metodoEnvio || 'N/A'}</small><br>
                                </div>
                                <div class="col-md-6 text-end">
                                    <h4 class="text-success mb-0">Total: $${Number(pedido.total).toLocaleString('es-MX', {minimumFractionDigits: 2})}</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                } else {
                    pedidosHTML += `
                    <div class="pedido-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h5 class="mb-1">${pedido.id}</h5>
                                <small class="text-muted"><i class="far fa-calendar me-1"></i>${fecha}</small>
                            </div>
                            <span class="badge badge-estado ${estadoClass}">${pedido.estado}</span>
                        </div>
                        <div class="mb-3">
                            ${productosHTML}
                        </div>
                        <div class="border-top pt-3">
                            <div class="row">
                                <div class="col-md-6">
                                    <small class="text-muted d-block mb-1"><strong>Envío a:</strong></small>
                                    <small>${pedido.datosEnvio?.nombre || 'N/A'}</small><br>
                                    <small>${pedido.datosEnvio?.direccion || 'N/A'}</small><br>
                                    <small>${pedido.datosEnvio?.ciudad || 'N/A'} - CP: ${pedido.datosEnvio?.codigoPostal || 'N/A'}</small>
                                </div>
                                <div class="col-md-6 text-end">
                                    <h4 class="text-success mb-0">Total: $${Number(pedido.total).toLocaleString('es-MX', {minimumFractionDigits: 2})}</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                }
            });

            listaPedidos.innerHTML = pedidosHTML;
            
            // Actualizar estadísticas
            document.getElementById('totalPedidos').textContent = totalPedidos;
        }

        // Verificar sesión
        const userId = localStorage.getItem('userId');
        const userEmail = localStorage.getItem('userEmail');

        if (!userId || !userEmail) {
            const confirmResult = await Swal.fire({
                icon: "warning",
                title: "Sesión no válida",
                text: "Debes iniciar sesión para ver tu cuenta",
                confirmButtonText: "Ir a Inicio",
                buttonsStyling: true,
                customClass: {
                    confirmButton: 'btn btn-danger'
                }
            });
            if (confirmResult.isConfirmed || confirmResult.isDismissed) {
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 500);
            }
        }

        // FUNCIÓN PARA OBTENER ROL
        async function obtenerRolUsuario(uid) {
            try {
                const docRef = doc(db, "usuarios", uid);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    return docSnap.data().rol || "usuario";
                } else {
                    console.warn("Usuario no encontrado en Firestore");
                    return "usuario";
                }
            } catch (error) {
                console.error("Error obteniendo rol:", error);
                return "usuario";
            }
        }

        // Función para mostrar toast
        function showToast(msg, type = "success") {
            const container = document.getElementById("toastZone");
            const toastEl = document.createElement("div");
            toastEl.className = `toast align-items-center text-bg-${type} border-0`;
            toastEl.setAttribute("role", "alert");
            toastEl.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${msg}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            container.appendChild(toastEl);
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
            setTimeout(() => toastEl.remove(), 4000);
        }

        

        // FUNCIÓN PRINCIPAL PARA CARGAR PEDIDOS
        async function cargarPedidos() {
            const listaPedidos = document.getElementById('listaPedidos');
            const userEmail = localStorage.getItem('userEmail');
            const emailElement = document.getElementById('emailPerfil');
            const userId = localStorage.getItem('userId')

            console.log('1. userId:', userId);
            
            if (emailElement) {
                emailElement.textContent = userEmail;
            }
            
            // 2. Verificar conexión
            if (!navigator.onLine) {
                console.log('Sin conexión a internet');
                if (!cachedPedidos || cachedPedidos.length === 0) {
                    listaPedidos.innerHTML = `
                        <div class="alert alert-warning">
                            <i class="fas fa-wifi-slash me-2"></i>
                            Sin conexión a internet. No hay pedidos guardados en caché.
                        </div>
                    `;
                } else {
                    // Agregar banner de modo offline si no existe
                    if (!document.getElementById('cache-banner')) {
                        const offlineBanner = document.createElement('div');
                        offlineBanner.id = 'offline-banner';
                        offlineBanner.className = 'alert alert-warning mb-3';
                        offlineBanner.innerHTML = `
                            <i class="fas fa-wifi-slash me-2"></i>
                            Modo offline - Mostrando datos guardados
                        `;
                        listaPedidos.insertBefore(offlineBanner, listaPedidos.firstChild);
                    }
                }
                return;
            }
            
            // 3. Intentar cargar desde Firebase
            try {
                console.log('Cargando pedidos desde Firebase...');
                const q = query(
                    collection(db, 'pedidos'),
                    where('userId', '==', userId),
                    orderBy('fecha', 'desc')
                );
                
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    listaPedidos.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-box-open fa-4x text-muted mb-3"></i>
                            <p class="text-muted">No tienes pedidos aún</p>
                            <a href="/index.html" class="btn btn-primary">Ver productos</a>
                        </div>
                    `;
                    // Limpiar caché si no hay pedidos
                    localStorage.removeItem(CACHE_KEY_PEDIDOS);
                    localStorage.removeItem(CACHE_TIMESTAMP_KEY);
                    return;
                }

                let pedidosArray = [];
                querySnapshot.forEach((doc) => {
                    pedidosArray.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                console.log(`${pedidosArray.length} pedidos cargados desde Firebase`);

                // Guardar en caché
                guardarPedidosEnCache(pedidosArray);
                
                // Mostrar pedidos (sin el banner de caché)
                mostrarPedidos(pedidosArray, false);

            } catch (error) {
                console.error('Error cargando pedidos desde Firebase:', error);
                
                // Si hay error y existe caché, usar el caché
                if (cachedPedidos && cachedPedidos.length > 0) {
                    console.log('Usando caché por error en Firebase');
                    mostrarPedidos(cachedPedidos, true);
                    
                    // Remover banner anterior y agregar banner de error
                    const oldBanner = document.getElementById('cache-banner');
                    if (oldBanner) oldBanner.remove();
                    
                    const errorBanner = document.createElement('div');
                    errorBanner.className = 'alert alert-warning mb-3';
                    errorBanner.innerHTML = `
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Error al actualizar. Mostrando datos guardados.
                    `;
                    listaPedidos.insertBefore(errorBanner, listaPedidos.firstChild);
                } else {
                    listaPedidos.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Error al cargar los pedidos: ${error.message}
                        </div>
                    `;
                }
            }
        }

        /* Detectar cambios en el estado de conexión */
        window.addEventListener('online', () => {
            console.log('Conexión restaurada');
            showToast('Conexión restaurada. Actualizando pedidos...', 'success');
            cargarPedidos();
        }); 

        window.addEventListener('offline', () => {
            console.log('Conexión perdida');
            showToast('Sin conexión. Mostrando datos guardados.', 'warning');
        });

        // AUTH STATE LISTENER
        onAuthStateChanged(auth, async (user) => {
            const btnLoginNav = document.getElementById('loginNavBtn');
            const btnRegisterNav = document.getElementById('registerNavBtn');
            const btnLogoutNav = document.getElementById('logoutBtn');
            const navInventario = document.getElementById('navInventario');

            if (user) {
                console.log("Usuario autenticado:", user.email);
                
                const rol = await obtenerRolUsuario(user.uid);
                console.log("Rol del usuario:", rol);
                
                localStorage.setItem('userRole', rol);
                localStorage.setItem('userEmail', user.email);
                localStorage.setItem('userId', user.uid);

                if (btnLoginNav) btnLoginNav.style.display = 'none';
                if (btnRegisterNav) btnRegisterNav.style.display = 'none';
                if (btnLogoutNav) btnLogoutNav.style.display = 'block';

                const toastMostrado = sessionStorage.getItem('loginToastShown');
                
                if (navInventario) {
                    if (rol === 'admin') {
                        navInventario.style.display = 'block';
                        if (!toastMostrado) {
                            showToast(`Bienvenido Admin: ${user.email}`, 'success');
                            sessionStorage.setItem('loginToastShown', 'true');
                        }
                    } else {
                        navInventario.style.display = 'none';
                        if (!toastMostrado) {
                            showToast(`Bienvenido: ${user.email}`, 'success');
                            sessionStorage.setItem('loginToastShown', 'true');
                        }
                    }
                }
            } else {
                console.log("No hay usuario autenticado");
                sessionStorage.removeItem('loginToastShown');
                localStorage.removeItem('userRole');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userId');

                if (btnLoginNav) btnLoginNav.style.display = 'block';
                if (btnRegisterNav) btnRegisterNav.style.display = 'block';
                if (btnLogoutNav) btnLogoutNav.style.display = 'none';
                if (navInventario) navInventario.style.display = 'none';
            }
        });

        // INICIALIZAR TODO
        cargarPedidos();

    </script>
    <script>

    // SISTEMA DE TRANSICIONES UNIVERSAL
    (function() {
        'use strict';
        
        // Prevenir animación en recarga
        if (performance.navigation.type === 1) {
            document.body.style.animation = 'none';
        }
        
        // Configuración
        const config = {
            animationClass: 'fade-out',
            duration: 300,
            ignoreSelectors: [
                '[data-bs-toggle]',
                '[href="#"]',
                '[href*="#modal"]',
                '[onclick]',
                '.no-transition',
                '[href^="https://wa.me"]'
            ]
        };
        
        // Función para verificar si debe ignorarse
        function shouldIgnoreLink(link) {
            return config.ignoreSelectors.some(selector => {
                return link.matches(selector) || link.closest(selector);
            });
        }
        
        // Función de transición
        function transitionToPage(url) {
            document.body.classList.add(config.animationClass);
            setTimeout(() => {
                window.location.href = url;
            }, config.duration);
        }
        
        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            // Interceptar todos los enlaces internos
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a');
                
                if (!link) return;
                
                const href = link.getAttribute('href');
                
                // Verificar si es un enlace válido
                if (!href || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('https://wa.me')) {
                    return;
                }
                
                // Ignorar ciertos enlaces
                if (shouldIgnoreLink(link)) {
                    return;
                }
                
                // Aplicar transición
                e.preventDefault();
                transitionToPage(href);
            });
            
            // Smooth scroll para anclas
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    if (href !== '#' && !this.getAttribute('data-bs-toggle')) {
                        e.preventDefault();
                        const target = document.querySelector(href);
                        if (target) {
                            target.scrollIntoView({
                                behavior: 'smooth',
                                block: 'start'
                            });
                        }
                    }
                });
            });

            // Animación al actualizar estadísticas
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.target.id === 'totalPedidos' || mutation.target.id === 'totalGastado') {
                        mutation.target.style.animation = 'none';
                        setTimeout(() => {
                            mutation.target.style.animation = 'numberPop 0.5s ease-out';
                        }, 10);
                    }
                });
            });

            const totalPedidos = document.getElementById('totalPedidos');
            const totalGastado = document.getElementById('totalGastado');
            
            if (totalPedidos) observer.observe(totalPedidos, { childList: true, characterData: true, subtree: true });
            if (totalGastado) observer.observe(totalGastado, { childList: true, characterData: true, subtree: true });
        });
    })();

    // Mostrar/Ocultar botón "Subir" según scroll y proximidad al footer
    document.addEventListener('DOMContentLoaded', function() {
        const btnUp = document.getElementById('btnUp');
        const footer = document.querySelector('footer');
        
        if (!btnUp || !footer) return;
        
        window.addEventListener('scroll', function() {
            const scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
            const footerPosition = footer.offsetTop;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;
            
            if (scrollPosition > 20) {
                // Verificar si el usuario está cerca del footer
                const distanceToFooter = footerPosition - (scrollPosition + windowHeight);
                
                if (distanceToFooter < 0 || (scrollPosition + windowHeight) >= documentHeight - 20) {
                    btnUp.style.opacity = '0';
                    btnUp.style.pointerEvents = 'none';
                } else {
                    btnUp.style.opacity = '1';
                    btnUp.style.pointerEvents = 'auto';
                }
            } else {
                btnUp.style.opacity = '0';
                btnUp.style.pointerEvents = 'none';
            }
        });
    });

    // Mostrar/Ocultar botón "WhatApp" según scroll y proximidad al footer
    document.addEventListener('DOMContentLoaded', function() {
        const btnUp = document.getElementById('btnWhats');
        const footer = document.querySelector('footer');
        
        if (!btnWhats || !footer) return;
        
        window.addEventListener('scroll', function() {
            const scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
            const footerPosition = footer.offsetTop;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;
            
            if (scrollPosition > 300) {
                // Verificar si el usuario está cerca del footer
                const distanceToFooter = footerPosition - (scrollPosition + windowHeight);
                
                if (distanceToFooter < 100 || (scrollPosition + windowHeight) >= documentHeight - 50) {
                    btnWhats.style.opacity = '0';
                    btnWhats.style.pointerEvents = 'none';
                } else {
                    btnWhats.style.opacity = '1';
                    btnWhats.style.pointerEvents = 'auto';
                }
            } else {
                btnWhats.style.opacity = '0';
                btnWhats.style.pointerEvents = 'none';
            }
        });
    });
    </script>
