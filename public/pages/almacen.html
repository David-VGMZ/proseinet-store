<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proseinet - Dashboard de Inventario</title>
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png"/>
    <link rel="icon" href="/assets/icons/icon-192.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Adaptación a la identidad gráfica de Proseinet */
        body { 
            background-color: #f8f9fa; 
        }

        .sidebar { 
            min-height: 100vh; background-color: #212529; color: white; 
        }

        .brand-logo { 
            font-weight: bold; letter-spacing: 1px; 
        }

        .table-hover tbody tr:hover { 
            cursor: pointer; 
        }

    </style>
</head>
<body>
    <div class="d-flex">
        <nav class="sidebar p-3" style="width: 250px;">
            <h4 class="brand-logo mb-4 text-center">PROSEINET</h4>
            <hr>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white active" href="#"><i class="bi bi-box-seam me-2"></i> Inventario Master</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#"><i class="bi bi-laptop me-2"></i> Equipos Proceso</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#"><i class="bi bi-file-earmark-arrow-down me-2"></i> Exportar Datos</a>
                </li>
            </ul>
        </nav>

        <main class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Gestión de Base de Datos</h2>
                <button class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuevo Registro</button>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Categoría</label>
                        <select class="form-select" id="filtroCategoria">
                            <option value="">Todas</option>
                            <option value="LAPTOP">Laptop</option>
                            <option value="ESCRITORIO">Escritorio</option>
                            <option value="MONITOR">Monitor</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Estatus</label>
                        <select class="form-select" id="filtroEstatus">
                            <option value="">Todos</option>
                            <option value="Almacén">Almacén</option>
                            <option value="Proceso">Proceso</option>
                            <option value="Vendido">Vendido</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Búsqueda por Serie o Modelo</label>
                        <input type="text" class="form-control" id="buscadorGeneral" placeholder="Ej. 5CBK7D3 o Latitude...">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-dark w-100" id="btnBuscar"><i class="bi bi-search"></i> Filtrar</button>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover table-striped mb-0" id="tablaInventario">
                        <thead class="table-dark">
                            <tr>
                                <th>N. Lote</th>
                                <th>Categoría</th>
                                <th>Marca/Modelo</th>
                                <th>RAM / Procesador</th>
                                <th>Serie</th>
                                <th>Estatus</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.css"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
