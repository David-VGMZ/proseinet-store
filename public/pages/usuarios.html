        @media (min-width: 992px) and (max-width: 1024px) {

    <div class="container-fluid my-5 pt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

        <!-- BUSCADOR Y FILTRO -->
        <div class="card card-inv mb-4 col-12 col-md-8 col-lg-6">

                <div class="flex-grow-1">

                    <select id="filtroRol" class="form-control">

                <div>
                    <button class="btn btn-primary-inv w-100 px-4" data-bs-toggle="modal" data-bs-target="#modalCrear"

                    </button>

        </div>

        <!-- TABLA -->
        <div class="card card-inv">

                <div class="d-flex justify-content-between mt-3">

    </div>

    <div class="modal fade" id="modalEditar" tabindex="-1">

                    <h5 class="modal-title">Editar Usuario</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Email:</strong> <span id="editEmail"></span></p>

                    <label class="fw-bold">Nombre:</label>
                    <input type="text" id="editNombre" class="form-control mb-2">

                    <label class="fw-bold">Rol:</label>
                    <select id="editRol" class="form-control mt-2">
                        <option value="Usuario">Usuario</option>
                        <option value="Administrador">Administrador</option>

                        <option value="Mayorista">Mayorista</option>

                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button id="btnGuardarCambios" class="btn btn-primary-inv">Guardar</button>
                </div>
            </div>
        </div>

    <!-- MODAL CREAR -->
    <div class="modal fade" id="modalCrear" tabindex="-1">

            <div class="modal-content card-inv">
                <div class="modal-header" style="background:var(--primary-blue); color:white;">
                    <h5 class="modal-title">Crear Usuario</h5>

                    <label>Contraseña</label>
                    <input id="nuevaContrasena" type="password" class="form-control mb-3">

                    <label>Rol</label>
                    <select id="nuevoRol" class="form-control mb-3">
                        <option value="Usuario">Usuario</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Operador">Operador</option>

                <div class="modal-footer">

    <footer id="fter" class="text-white py-5" style="background-color: white;">
        <div class="container">
            <p class="text-center mt-2 mb-0">&copy; <strong>Gadget Go</strong> - Todos los derechos reservados</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">

        //FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBg9o3wVZoA26Aob2RnbVPV8vGv4GE44gs",
            authDomain: "primer-proyecto-7b2f4.firebaseapp.com",
            projectId: "primer-proyecto-7b2f4",
            storageBucket: "primer-proyecto-7b2f4.appspot.com",
            messagingSenderId: "627220736817",
            appId: "1:627220736817:web:a2eb4f187322c609f11e10"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const appSecundaria = initializeApp(firebaseConfig, "AppRegistroProseinet");
        const authSecundario = getAuth(appSecundaria);

        //VARIABLES DE PAGINACIÓN
        let listaUsuarios = [];
        let filtrados = [];
        let page = 1;
        let perPage = 10;

        //CARGAR USUARIOS

        async function cargarUsuarios() {
            listaUsuarios = [];
            const snap = await getDocs(collection(db, "usuarios"));
            snap.forEach(d => listaUsuarios.push({ id: d.id, ...d.data() }));
            aplicarFiltros();
        }

        //APLICAR BUSQUEDA / FILTROS

        function aplicarFiltros() {
            const texto = document.getElementById("inputBuscar").value.toLowerCase();
            const rol = document.getElementById("filtroRol").value;

            filtrados = listaUsuarios.filter(u => {
                const matchTexto =
                    u.email.toLowerCase().includes(texto) ||
                    (u.nombre ?? "").toLowerCase().includes(texto) ||
                    u.rol.toLowerCase().includes(texto);
                const matchRol = rol === "todos" || u.rol === rol;
                return matchTexto && matchRol;
            });

            page = 1;
            renderTabla();
        }

        // RENDER PAGINADO

        function renderTabla() {
            const tbody = document.getElementById("usuariosContainer");
            tbody.innerHTML = "";

            const start = (page - 1) * perPage;
            const pageUsers = filtrados.slice(start, start + perPage);

            pageUsers.forEach(u => {
                tbody.innerHTML += `
                <tr>
                    <td>${u.nombre || 'S/N'}</td>
                    <td>${u.email}</td>
                    <td><span class="badge badge-role">${u.rol}</span></td>
                    <td class="mb-td">
                        <button class="btn btn-warning btn-sm me-2 mb-2"
                            onclick="editarUsuario('${u.id}','${u.email}','${u.rol}', '${u.nombre || ''}')">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-danger btn-sm mb-2"
                            onclick="eliminarUsuario('${u.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>`;
            });

            /* INFO PÁGINA */
            const pageInfo = document.getElementById("pageInfo");
            const totalPages = Math.ceil(filtrados.length / perPage) || 1;

            pageInfo.textContent = `Página ${page} / ${totalPages}`;

            document.getElementById("btnPrev").disabled = page === 1;
            document.getElementById("btnNext").disabled = page === totalPages;
        }

        /* BOTONES DE PAGINACIÓN */
        document.getElementById("btnPrev").onclick = () => { page--; renderTabla(); };
        document.getElementById("btnNext").onclick = () => { page++; renderTabla(); };

        document.getElementById("inputBuscar").oninput = aplicarFiltros;
        document.getElementById("filtroRol").onchange = aplicarFiltros;

        //  EDITAR / ELIMINAR

        window.editarUsuario = function (id, email, rol, nombre) {
            window.editID = id;
            document.getElementById("editEmail").textContent = email;
            document.getElementById("editRol").value = rol;
            document.getElementById("editNombre").value = nombre;

            new bootstrap.Modal(document.getElementById("modalEditar")).show();
        };

        document.getElementById("btnGuardarCambios").onclick = async () => {
            const btnGuardar = document.getElementById('btnGuardarCambios');
            const nuevoNombre = document.getElementById("editNombre").value.trim();

            if (!nuevoNombre) {
                alert("El nombre no puede estar vacío.");
                return;
            }

            btnGuardar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Actualizando';
            btnGuardar.disabled = true;

            try {
                await updateDoc(doc(db, "usuarios", window.editID), {
                    rol: document.getElementById("editRol").value,
                    nombre: nuevoNombre
                });

                const modalEditar = bootstrap.Modal.getInstance(document.getElementById('modalEditar'));
                if (modalEditar) {
                    modalEditar.hide();
                }

                cargarUsuarios();

            } catch (error) {
                console.error("Error al actualizar el usuario", error);
                alert("Ocurrio un error al actualizar el usuario");
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.innerHTML = 'Guardar';
            }
        };

        window.eliminarUsuario = async function (id) {
            if (confirm("¿Eliminar usuario?")) {
                await deleteDoc(doc(db, "usuarios", id));
                cargarUsuarios();
            }
        };

        document.getElementById("btnCrearUsuario").onclick = async () => {
            const emailInput = document.getElementById("nuevoEmail");
            const nombreInput = document.getElementById("nuevoNombre");
            const passInput = document.getElementById("nuevaContrasena");
            const rolInput = document.getElementById("nuevoRol");
            const btnCrear = document.getElementById("btnCrearUsuario");

            // Validación básica
            if (!emailInput.value.trim() || !nombreInput.value.trim() || !passInput.value.trim()) {
                alert("Por favor, llena todos los campos (Nombre, Correo y Contraseña).");
                return;
            }

            btnCrear.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creando...';
            btnCrear.disabled = true;

            try {

                const userCredential = await createUserWithEmailAndPassword(
                    authSecundario,
                    emailInput.value.trim(),
                    passInput.value.trim()
                );

                const nuevoUID = userCredential.user.uid;

                await setDoc(doc(db, "usuarios", nuevoUID), {
                    email: emailInput.value.trim(),
                    nombre: nombreInput.value.trim(),
                    rol: rolInput.value,
                    fechaCreacion: new Date().toISOString()
                });

                const modalCrear = bootstrap.Modal.getInstance(document.getElementById('modalCrear'));
                if (modalCrear) modalCrear.hide();

                // Limpiar campos
                emailInput.value = "";
                nombreInput.value = "";
                passInput.value = "";
                rolInput.value = "Usuario";

                cargarUsuarios();

            } catch (error) {
                console.error("Error al crear usuario:", error);
                // Manejo de errores comunes de Firebase Auth
                if (error.code === 'auth/email-already-in-use') {
                    alert("Este correo ya está registrado en el sistema.");
                } else if (error.code === 'auth/weak-password') {
                    alert("La contraseña debe tener al menos 6 caracteres.");
                } else {
                    alert("Ocurrió un error al crear el usuario: " + error.message);
                }
            } finally {
                btnCrear.innerHTML = 'Crear';
                btnCrear.disabled = false;
            }
        };

        cargarUsuarios();
    </script>
</body>
