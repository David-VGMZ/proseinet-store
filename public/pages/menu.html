        async function obtenerRolUsuario(uid) {
            try {
                const docRef = doc(db, "usuarios", uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    return docSnap.data().rol || "usuario";
                } else {
                    console.warn("Usuario no encontrado en Firestore");
                    return "usuario";
                }
            } catch (error) {
                console.error("Error obteniendo rol:", error);
                return "usuario";
            }
        }

                    `;

                    //renderLista(lista);
                }

                console.error('Error cargando productos filtrados:', e);

        // Lee y COMPRIME múltiples imágenes
        function readFilesAsDataURLs(fileList, maxSize = 512) {
            const files = Array.from(fileList || []);

            return Promise.all(files.map(file => compressImage(file, maxSize)));
        }
        // Funcion para comprimir imagenes de los productos
        // Comprime una sola imagen
        function compressImage(file, maxSize = 512) {
            return new Promise((resolve, reject) => {

                const reader = new FileReader();
                reader.onload = e => {

                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");

                        // Obtener tamaño original
                        let width = img.width;
                        let height = img.height;

                        // Redimensionar si es necesario
                        if (width > height) {
                            if (width > maxSize) {
                                height *= maxSize / width;
                                width = maxSize;
                            }
                        } else {
                            if (height > maxSize) {
                                width *= maxSize / height;
                                height = maxSize;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);

                        // Comprimir como JPG calidad 0.75
                        const dataURL = canvas.toDataURL("image/jpeg", 0.75);

                        resolve({
                            name: file.name,
                            type: "image/jpeg",
                            dataURL: dataURL
                        });
                    };

                    img.onerror = reject;
                    img.src = e.target.result;
                };

                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

            // Callback cuando vuelve online
            async () => {
                showToast('Conexión restaurada', 'success');

                // LIMPIAR LA BANDERA AL VOLVER ONLINE
                sessionStorage.removeItem('offlineToastShown');

                // Sincronizar pedidos pendientes
                try {
                    const pedidosPendientes = await obtenerPedidosNoSincronizados();
                    if (pedidosPendientes.length > 0) {
                        console.log(`Sincronizando ${pedidosPendientes.length} pedidos pendientes...`);

                        for (const pedido of pedidosPendientes) {
                            try {
                                const docRef = await addDoc(collection(db, 'pedidos'), {
                                    ...pedido,
                                    fecha: serverTimestamp()
                                });

                                await marcarPedidoSincronizado(pedido.id);
                                console.log(`Pedido ${pedido.id} sincronizado con ID ${docRef.id}`);
                            } catch (error) {
                                console.error(`Error sincronizando pedido ${pedido.id}:`, error);
                            }
                        }

                        showToast(`${pedidosPendientes.length} pedido(s) sincronizado(s)`, 'success');
                    }
                } catch (error) {
                    console.error('Error en sincronización:', error);
                }

                // Recargar productos desde Firebase
                cargarProductos();
            },
            // Callback cuando se pierde conexión
            () => {
                // MOSTRAR TOAST SOLO UNA VEZ AL PERDER CONEXIÓN
                if (!sessionStorage.getItem('offlineToastShown')) {
                    showToast('Sin conexión - Modo offline activado', 'warning');
                    sessionStorage.setItem('offlineToastShown', 'true');
                }
                // Intentar cargar productos desde IndexedDB inmediatamente
                cargarProductos();
            }
        );

        function buscarProductos() {
            const texto = document.getElementById('busquedaInput').value.toLowerCase().trim();

            if (!texto) {
                renderLista(listaGlobal);
                return;
            }

            const filtrados = listaGlobal.filter(p =>
                p.nombre.toLowerCase().includes(texto) ||
                (p.descripcion && p.descripcion.toLowerCase().includes(texto)) ||
                (p.categoria && p.categoria.toLowerCase().includes(texto))
            );

            renderLista(filtrados);
        }

        window.buscarProductos = buscarProductos;

    </script>

        });

        document.addEventListener('click', async (e) => {

                if (!deferredPrompt) return;
                e.target.disabled = true;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('Instalación:', outcome);
                deferredPrompt = null;
                e.target.hidden = true;
            }
        });

        // Evento cuando la app fue instalada
        window.addEventListener('appinstalled', () => {
            console.log('PWA instalada');
            const btn = document.getElementById('btnInstall');
            if (btn) btn.hidden = true;
        });

        // Agregar después de registrar el SW en index.html
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sworker.js')
                    .then(reg => {
                        console.log('SW registrado:', reg.scope);

                        // Forzar actualización si hay una nueva versión
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('Nueva versión disponible');
                                    // Puedes mostrar un toast aquí para avisar al usuario

            toastEl.setAttribute("role", "alert");
            toastEl.setAttribute("aria-live", "assertive");
            toastEl.setAttribute("aria-atomic", "true");

            toastEl.innerHTML = `
            <div class="d-flex mt-1">
                <div class="toast-body">${msg}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="Close"></button>

            container.appendChild(toastEl);

        // Mostrar/Ocultar botón "Subir" según scroll y proximidad al footer
        document.addEventListener('DOMContentLoaded', function () {
            const btnUp = document.getElementById('btnUp');
            const footer = document.querySelector('footer');

            if (!btnUp || !footer) return;

            window.addEventListener('scroll', function () {
                const scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
                const footerPosition = footer.offsetTop;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;

                // Mostrar botón si se ha hecho scroll hacia abajo (más de 300px)
                if (scrollPosition > 300) {
                    // Verificar si el usuario está cerca del footer
                    const distanceToFooter = footerPosition - (scrollPosition + windowHeight);

                    // Ocultar si está a menos de 100px del footer o si llegó al final
                    if (distanceToFooter < 100 || (scrollPosition + windowHeight) >= documentHeight - 50) {
                        btnUp.style.opacity = '0';
                        btnUp.style.pointerEvents = 'none';
                    } else {
                        btnUp.style.opacity = '1';
                        btnUp.style.pointerEvents = 'auto';
                    }
                } else {
                    // Ocultar si está en la parte superior
                    btnUp.style.opacity = '0';
                    btnUp.style.pointerEvents = 'none';

    <script>

        // SISTEMA DE TRANSICIONES UNIVERSAL
        (function () {
            'use strict';

            // Prevenir animación en recarga
            if (performance.navigation.type === 1) {
                document.body.style.animation = 'none';
            }

            // Configuración
            const config = {
                animationClass: 'fade-out',
                duration: 300,
                ignoreSelectors: [
                    '[data-bs-toggle]',
                    '[href="#"]',
                    '[href*="#modal"]',
                    '[onclick]',
                    '.no-transition'
                ]
            };

            // Función para verificar si debe ignorarse
            function shouldIgnoreLink(link) {
                return config.ignoreSelectors.some(selector => {
                    return link.matches(selector) || link.closest(selector);
                });
            }

            // Función de transición
            function transitionToPage(url) {
                document.body.classList.add(config.animationClass);
                setTimeout(() => {
                    window.location.href = url;
                }, config.duration);
            }

            // Inicializar cuando el DOM esté listo
            document.addEventListener('DOMContentLoaded', function () {
                // Interceptar todos los enlaces internos
                document.addEventListener('click', function (e) {
                    const link = e.target.closest('a');

                    if (!link) return;

                    const href = link.getAttribute('href');

                    // Verificar si es un enlace válido
                    if (!href || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:')) {
                        return;
                    }

                    // Ignorar ciertos enlaces
                    if (shouldIgnoreLink(link)) {
                        return;
                    }

                    // Aplicar transición
                    e.preventDefault();
                    transitionToPage(href);
                });

                // Agregar clase a cards para hover
                const cards = document.querySelectorAll('.card');
                cards.forEach(card => {
                    card.style.cursor = 'pointer';
                });
            });

            // Smooth scroll para anclas
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    const href = this.getAttribute('href');
                    if (href !== '#' && !this.getAttribute('data-bs-toggle')) {
                        e.preventDefault();
                        const target = document.querySelector(href);
                        if (target) {
                            target.scrollIntoView({
                                behavior: 'smooth',
                                block: 'start'
                            });
                        }
                    }
                });
            });
        })();

        // RESET AUTOMÁTICO DE MODALES
        document.addEventListener('DOMContentLoaded', function () {
            // Obtener todos los modales
            const modales = document.querySelectorAll('.modal');

            modales.forEach(modal => {
                modal.addEventListener('hidden.bs.modal', function () {
                    // Limpiar todos los inputs de texto, email, password, textarea
                    const inputs = this.querySelectorAll('input[type="text"], input[type="email"], input[type="password"], input[type="tel"], textarea');
                    inputs.forEach(input => {
                        input.value = '';
                    });

                    // Limpiar selects
                    const selects = this.querySelectorAll('select');
                    selects.forEach(select => {
                        select.selectedIndex = 0;
                    });

                    // Limpiar checkboxes y radios
                    const checkboxes = this.querySelectorAll('input[type="checkbox"], input[type="radio"]');
                    checkboxes.forEach(checkbox => {
                        checkbox.checked = false;
                    });

                    // Limpiar mensajes de error
                    const errorMessages = this.querySelectorAll('.text-danger, .alert-danger');
                    errorMessages.forEach(msg => {
                        msg.textContent = '';
                        msg.style.display = 'none';
                    });

                    // Remover clases de validación de Bootstrap
                    const formControls = this.querySelectorAll('.form-control, .form-select');
                    formControls.forEach(control => {
                        control.classList.remove('is-valid', 'is-invalid');
                    });

                    // Resetear formularios si existen
                    const forms = this.querySelectorAll('form');
                    forms.forEach(form => {
                        form.reset();
                    });
                });
            });
        });
    </script>
