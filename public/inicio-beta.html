    <script>

    // SISTEMA DE TRANSICIONES UNIVERSAL
    (function() {
        'use strict';
                if (performance.navigation.type === 1) {
            document.body.style.animation = 'none';
        }
        // Configuración
        const config = {
            animationClass: 'fade-out',
            duration: 300,
            ignoreSelectors: [
                '[data-bs-toggle]',
                '[href="#"]',
                '[href*="#modal"]',
                '[onclick]',
                '.no-transition'
            ]
        };
        
        // Función para verificar si debe ignorarse
        function shouldIgnoreLink(link) {
            return config.ignoreSelectors.some(selector => {
                return link.matches(selector) || link.closest(selector);
            });
        }
        
        // Función de transición
        function transitionToPage(url) {
            document.body.classList.add(config.animationClass);
            setTimeout(() => {
                window.location.href = url;
            }, config.duration);
        }
        
        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a');
                
                if (!link) return;
                
                const href = link.getAttribute('href');
                
                // Verificar si es un enlace válido
                if (!href || href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:')) {
                    return;
                }
                // Ignorar ciertos enlaces
                if (shouldIgnoreLink(link)) {
                    return;
                }
                // Aplicar transición
                e.preventDefault();
                transitionToPage(href);
            });
            
            // Agregar clase a cards para hover
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.style.cursor = 'pointer';
            });
        });
        
        // Smooth scroll para anclas
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href !== '#' && !this.getAttribute('data-bs-toggle')) {
                    e.preventDefault();
                    const target = document.querySelector(href);
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                }
            });
        });
    })();

    // RESET AUTOMÁTICO DE MODALES
    document.addEventListener('DOMContentLoaded', function() {
        const modales = document.querySelectorAll('.modal');
        
        modales.forEach(modal => {
            modal.addEventListener('hidden.bs.modal', function () {
                // Limpiar todos los inputs de texto, email, password, textarea
                const inputs = this.querySelectorAll('input[type="text"], input[type="email"], input[type="password"], input[type="tel"], textarea');
                inputs.forEach(input => {
                    input.value = '';
                });
                // Limpiar selects
                const selects = this.querySelectorAll('select');
                selects.forEach(select => {
                    select.selectedIndex = 0;
                });
                // Limpiar checkboxes y radios
                const checkboxes = this.querySelectorAll('input[type="checkbox"], input[type="radio"]');
                checkboxes.forEach(checkbox => {
                    checkbox.checked = false;
                });
                // Limpiar mensajes de error
                const errorMessages = this.querySelectorAll('.text-danger, .alert-danger');
                errorMessages.forEach(msg => {
                    msg.textContent = '';
                    msg.style.display = 'none';
                });
                // Remover clases de validación de Bootstrap
                const formControls = this.querySelectorAll('.form-control, .form-select');
                formControls.forEach(control => {
                    control.classList.remove('is-valid', 'is-invalid');
                });
                // Resetear formularios si existen
                const forms = this.querySelectorAll('form');
                forms.forEach(form => {
                    form.reset();
                });
            });
        });
    });
    </script>
